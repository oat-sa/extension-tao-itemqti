<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Test - CKEditor Configurator helper</title>
        <base href="../../../../../../../tao/views/"/>
        <link rel="stylesheet" type="text/css" href="js/lib/qunit/qunit.css">
        <link rel="stylesheet" href="css/tao-main-style.css"/>
        <link rel="stylesheet" href="css/tao-3.css"/>
        <script type="text/javascript" src="js/lib/qunit/qunit.js"></script>
        <script type="text/javascript" src="js/lib/require.js"></script>
        <script type="text/javascript" src="js/lib/qunit/qunit-parameterize.js"></script>

        <script  type="text/javascript">

            QUnit.config.autostart = false;

            require(['/tao/ClientConfig/config'], function(){
                require.config({
                    config: {
                        'tao/ckeditor/wproofreaderBootstrap': {
                            spellCheckConfig: {
                                enabled: true,
                                providerId: 'wproofreader',
                                providerConfig: {
                                    serviceId: 'test'
                                }
                            }
                        }
                    }
                });

                require(['taoQtiItem/test/qtiCreator/helper/ckConfigurator/test'], function () {

                    QUnit.start();
                });
            });
        </script>
    </head>
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture"></div>
    </body>
</html>
